# dsh-delegation-guard bundle patch layer.
#
# One bare plugin row. The package has a host half only: it registers no tool
# and no client surface. It listens on the host's `tools/pre-execute` seam to
# refuse the one-shot delegation path before dispatch, and on `subagent/start`
# and `subagent/end` to bound how long a delegating session may wait.
#
# Row id `delegation-guard` equals the host half's `export const name` in
# src/index.js. It is checked by hand against every other row id in this
# repository; `aggregate.mjs --check` does not validate id uniqueness.
#
# This plugin owns no configuration: the ten-minute bound and the ban itself are
# the rules it exists to enforce, so they are constants in the source rather
# than settings that can drift away from the rules.
- insert:
    - id: delegation-guard
      name: '@logictan/dsh-delegation-guard'
