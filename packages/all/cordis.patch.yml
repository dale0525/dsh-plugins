# from ../dsh-fakeip-fetch
# dsh-fakeip-fetch bundle patch layer.
#
# Two entries, both required:
#
# 1. The upstream `web-fetch-http` row is disabled. That plugin registers the
#    fetch provider id `http`, and so does this one (deliberately: it keeps the
#    `web` row's `fetchProvider: http` config untouched, so this package never
#    has to restate — and never drifts from — `dsh-base`'s web row). Registering
#    the same id twice throws `WEB_DUPLICATE_PROVIDER`, so the original row must
#    stand down. Disabling (rather than editing) it also means re-enabling is a
#    one-line revert in the profile patch, and that `dsh-base` stays unmodified.
#
# 2. This plugin's own row is inserted.
#
# Row id `fakeip-fetch` equals the host half's `export const name` in
# src/index.js. It is distinct from the provider id `http` on purpose: the row
# id names the loader entry, the provider id names the web seam registration.
- id: web-fetch-http
  disabled: true

- insert:
    - id: fakeip-fetch
      name: '@logictan/dsh-fakeip-fetch'

# from ../dsh-agy-link
# dsh-agy-link bundle patch — inserts the antigravity (agy CLI) provider
# plugin entry into the composition. Users install via:
#   dsh plugin --profile web add @logictan/dsh-plugins-all
- insert:
    - id: agy-link
      name: '@logictan/dsh-agy-link'
      config:
        enabled: !!js "process.env.DSH_AGY_ENABLED ?? 'true'"
        agyBin: !!js "process.env.DSH_AGY_BIN ?? ''"
        # permissionMode: skip | plan | accept-edits  (skip passes
        # --dangerously-skip-permissions; see README security notes)
        permissionMode: !!js "process.env.DSH_AGY_MODE ?? 'skip'"
        workspaceRoot: !!js "process.env.DSH_AGY_WORKSPACE_ROOT ?? ''"
        defaultModel: !!js "process.env.DSH_AGY_DEFAULT_MODEL ?? ''"
        defaultEffort: !!js "process.env.DSH_AGY_DEFAULT_EFFORT ?? ''"

# from ../dsh-browser-agent
# dsh-browser-agent bundle patch layer.
#
# One bare plugin row. The package ships two halves — the host half
# (exports ".") registers the `browser_agent` model tool and exports the
# `Config` schema the Plugins page derives its form from, the browser half
# (exports "./client") registers the Plugins-page configuration card.
#
# The row must stay a BARE package name: the web plugin table locates each
# package's `dsh.client` manifest from the specifier of the loader row that
# mounts it, and that lookup accepts only a bare name — a subpath row resolves
# to no manifest, so the browser half would silently never load.
#
# Row id `browser-agent` equals the host half's `export const name` in
# src/index.js. It is checked by hand against every other row id in this
# repository; `aggregate.mjs --check` does not validate id uniqueness.
- insert:
    - id: browser-agent
      name: '@logictan/dsh-browser-agent'

# from ../dsh-desktop-agent
# dsh-desktop-agent bundle patch layer.
