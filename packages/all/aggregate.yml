# 聚合包清单（手写）：scripts/aggregate.mjs 据此生成 cordis.patch.yml 与 package.json 的 dependencies。
# patchFrom: 该子包的 cordis.patch.yml 会被汇总进本包 patch（按顺序拼接，保留行 id）。
# deps: 该子包以普通 semver range 写进本包 dependencies（版本取自子包 package.json）。
patchFrom:
  - ../dsh-config-manager
  - ../dsh-easyrewrite
  - ../dsh-imagegen
  - ../dsh-fakeip-fetch
  - ../dsh-browser-agent
  - ../dsh-desktop-agent
  - ../dsh-openviking
  - ../dsh-loop-guard
  - ../dsh-better-reasoning-effort
  - ../dsh-todo-goal
  - ../dsh-goal-resume
  - ../dsh-force-rules
  - ../dsh-reasoning-strip
  - ../dsh-stitch-designer
deps:
  - ../dsh-config-manager
  - ../dsh-easyrewrite
  - ../dsh-imagegen
  - ../dsh-fakeip-fetch
  - ../dsh-browser-agent
  - ../dsh-desktop-agent
  - ../dsh-openviking
  - ../dsh-loop-guard
  # dsh-better-reasoning-effort is a fork of the unscoped npm package
  # `dsh-better-reasoning-effort`. It declares the SAME patch row id
  # (`dsh-better-reasoning-effort`, equal to its host half's `export const name`),
  # so the two packages cannot be installed side by side: the loader hard-crashes
  # with `duplicate loader entry id: dsh-better-reasoning-effort`. Swap, never
  # co-install — remove the upstream package first, then install this bundle.
  - ../dsh-better-reasoning-effort
  - ../dsh-todo-goal
  - ../dsh-goal-resume
  - ../dsh-force-rules
  - ../dsh-reasoning-strip
  # dsh-stitch-designer registers the 15 `mcp__stitch__*` tool names itself, so it
  # REPLACES the global `mcp-stitch` patch row rather than coexisting with it.
  # Two registrations of one tool name throw (`NamedEntries`: `tool "<name>" is
  # already registered`), which would leave this plugin's tools unregistered while
  # the old row kept serving. Remove the `mcp-stitch` row from
  # `$DSH_HOME/cordis.patch.yml` before installing this bundle; the API key moves
  # to the `STITCH_API_KEY` credential (set it on the Plugins page).
  - ../dsh-stitch-designer
