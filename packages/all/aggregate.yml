# 聚合包清单（手写）：scripts/aggregate.mjs 据此生成 cordis.patch.yml 与 package.json 的 dependencies。
# patchFrom: 该子包的 cordis.patch.yml 会被汇总进本包 patch（按顺序拼接，保留行 id）。
# deps: 该子包以普通 semver range 写进本包 dependencies（版本取自子包 package.json）。
patchFrom:
  - ../dsh-config-manager
  - ../dsh-easyrewrite
  - ../dsh-imagegen
  - ../dsh-fakeip-fetch
  - ../dsh-browser-agent
  - ../dsh-desktop-agent
  - ../dsh-openviking
  - ../dsh-loop-guard
  - ../dsh-better-reasoning-effort
  - ../dsh-todo-goal
  - ../dsh-goal-resume
  - ../dsh-force-rules
  - ../dsh-reasoning-strip
  - ../dsh-stitch-designer
  - ../dsh-worktree-session
  # dsh-modal-h3 registers the six `mcp__modal_h3__*` tools itself and needs no
  # MCP row. Its Modal account pool is a credential (MODAL_H3_ACCOUNTS), not a
  # patch value, so the row carries no config — set the pool from the Plugins
  # page. The plugin ships the Modal App and its pinned assets under app/ and
  # assets/, so no external repository or pixi workspace is needed: `pixi` on
  # PATH is the only host prerequisite.
  - ../dsh-modal-h3
  # dsh-macos-theme re-paints the whole UI: it stacks a token override layer on
  # whichever base theme is active and injects the structural CSS for the desktop
  # gradient, the floating window and the per-column surfaces. It is cosmetic and
  # additive, so it coexists with every other plugin here.
  - ../dsh-macos-theme
  # dsh-ssh replaces the `secret-safe-ssh` skill: it registers the four `ssh_*`
  # tools itself (no MCP row) and runs over `ssh2`, so it needs no `ssh`/`scp`
  # binary, no python and no POSIX shell — the same code path works on Windows.
  # Hosts are a config list of alias/host/port/username; each host's password is
  # the credential `SSH_PASSWORD_<ALIAS>` (set it on the Plugins page), so the
  # row carries no config and no secret ever lands in cordis.patch.yml.
  - ../dsh-ssh
  # The shared component layer every plugin's settings card imports. It has a row
  # of its own so `dsh-client-modules` puts it into the browser module table — a
  # package that is only a `dependencies` entry never gets there, and the
  # consumer's `require` fails with `missed the module table`. Consumers declare
  # it in `dsh.client.external`, which orders this row ahead of them.
  - ../dsh-plugins-shared-client
deps:
  - ../dsh-config-manager
  - ../dsh-easyrewrite
  - ../dsh-imagegen
  - ../dsh-fakeip-fetch
  - ../dsh-browser-agent
  - ../dsh-desktop-agent
  - ../dsh-openviking
  - ../dsh-loop-guard
  # dsh-better-reasoning-effort is a fork of the unscoped npm package
  # `dsh-better-reasoning-effort`. It declares the SAME patch row id
  # (`dsh-better-reasoning-effort`, equal to its host half's `export const name`),
  # so the two packages cannot be installed side by side: the loader hard-crashes
  # with `duplicate loader entry id: dsh-better-reasoning-effort`. Swap, never
  # co-install — remove the upstream package first, then install this bundle.
  - ../dsh-better-reasoning-effort
  - ../dsh-todo-goal
  - ../dsh-goal-resume
  - ../dsh-force-rules
  - ../dsh-reasoning-strip
  # dsh-stitch-designer registers the 15 `mcp__stitch__*` tool names itself, so it
  # REPLACES the global `mcp-stitch` patch row rather than coexisting with it.
  # Two registrations of one tool name throw (`NamedEntries`: `tool "<name>" is
  # already registered`), which would leave this plugin's tools unregistered while
  # the old row kept serving. Remove the `mcp-stitch` row from
  # `$DSH_HOME/cordis.patch.yml` before installing this bundle; the API key moves
  # to the `STITCH_API_KEY` credential (set it on the Plugins page).
  - ../dsh-stitch-designer
  - ../dsh-worktree-session
  # dsh-modal-h3 registers the six `mcp__modal_h3__*` tools itself and needs no
  # MCP row. Its Modal account pool is a credential (MODAL_H3_ACCOUNTS), not a
  # patch value, so the row carries no config — set the pool from the Plugins
  # page. The plugin ships the Modal App and its pinned assets under app/ and
  # assets/, so no external repository or pixi workspace is needed: `pixi` on
  # PATH is the only host prerequisite.
  - ../dsh-modal-h3
  # dsh-macos-theme re-paints the whole UI: it stacks a token override layer on
  # whichever base theme is active and injects the structural CSS for the desktop
  # gradient, the floating window and the per-column surfaces. It is cosmetic and
  # additive, so it coexists with every other plugin here.
  - ../dsh-macos-theme
  # dsh-ssh replaces the `secret-safe-ssh` skill: it registers the four `ssh_*`
  # tools itself (no MCP row) and runs over `ssh2`, so it needs no `ssh`/`scp`
  # binary, no python and no POSIX shell — the same code path works on Windows.
  # Hosts are a config list of alias/host/port/username; each host's password is
  # the credential `SSH_PASSWORD_<ALIAS>` (set it on the Plugins page), so the
  # row carries no config and no secret ever lands in cordis.patch.yml.
  - ../dsh-ssh
  # The shared component layer every plugin's settings card imports. It has a row
  # of its own so `dsh-client-modules` puts it into the browser module table — a
  # package that is only a `dependencies` entry never gets there, and the
  # consumer's `require` fails with `missed the module table`. Consumers declare
  # it in `dsh.client.external`, which orders this row ahead of them.
  - ../dsh-plugins-shared-client
