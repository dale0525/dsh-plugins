# 聚合包清单（手写）：scripts/aggregate.mjs 据此生成 cordis.patch.yml 与 package.json 的 dependencies。
# patchFrom: 该子包的 cordis.patch.yml 会被汇总进本包 patch（按顺序拼接，保留行 id）。
# deps: 该子包以普通 semver range 写进本包 dependencies（版本取自子包 package.json）。
patchFrom:
  - ../dsh-config-manager
  - ../dsh-workbuddy-connect
  - ../dsh-easyrewrite
  - ../dsh-market
  - ../dsh-imagegen
  - ../dsh-fakeip-fetch
  - ../ctx-mem
  - ../dsh-agy-link
deps:
  - ../dsh-config-manager
  - ../dsh-workbuddy-connect
  - ../dsh-easyrewrite
  - ../dsh-market
  - ../dsh-imagegen
  - ../dsh-fakeip-fetch
  # ctx-mem declares ONE row (its bridge). The engine is mounted by the row the
  # bridge injects into a preset's `isolate: { compaction: true }` group, which
  # no profile-plane row can reach — but the package must still be INSTALLED:
  # the bridge row names `@logictan/dsh-ctx-mem`, and the injected row
  # names `@logictan/dsh-ctx-mem/engine` — both resolve by package name from the profile
  # root. patchFrom alone would ship a row whose package is absent from a fresh
  # profile.
  - ../ctx-mem
  - ../dsh-agy-link
