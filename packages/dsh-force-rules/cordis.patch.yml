# dsh-force-rules bundle patch layer.
#
# One bare plugin row. The package has a host half only: it registers no tool
# and no client surface. It listens on the host's `tools/pre-execute` seam to
# refuse the one-shot delegation path before dispatch, on `subagent/start` and
# `subagent/end` to bound how long a delegating session may wait, and on
# `agent/turn-stopping` to steer the plain-speech mandate back in at the turn
# boundary.
#
# Row id `force-rules` equals the host half's `export const name` in
# src/index.js. It is checked by hand against every other row id in this
# repository; `aggregate.mjs --check` does not validate id uniqueness.
#
# This plugin owns no configuration: the ten-minute bound and the rules
# themselves are what it exists to enforce, so they are constants in the source
# rather than settings that can drift away from the rules.
- insert:
    - id: force-rules
      name: '@logictan/dsh-force-rules'
