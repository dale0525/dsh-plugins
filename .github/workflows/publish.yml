# 发布：把本仓库的包发到 npm。
#
# 认证走 **trusted publishing (OIDC)** —— 不存任何长期 token。
# npm 正在移除 bypass-2FA token 的直接发布能力（官方 targeting 2027-01），
# 且 write token 需定期轮换；OIDC 每次发布换取短时、工作流专属、不可导出的凭证。
#
# 前置（一次性，人工）：每个包在 npmjs.com 配好 trusted publisher，
# 且 **必须勾选 allow publish**（2026-09-03 之后创建的配置默认只允许 stage publish）。
# 等价 CLI：npm trust github <pkg> --file publish.yml --repo dale0525/dsh-plugins --allow-publish
#
# 发布顺序由 scripts/publish.mjs 从依赖边拓扑推导（子插件 → 聚合包），不写死包名。
# 触发方式：
#   - push tag v*：自动发布（正式发版路径）；
#   - workflow_dispatch：手动，可只预览计划（dry_run）。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印发布计划，不真正发布'
        required: false
        type: boolean
        default: false

# id-token: write 是 OIDC 的硬性要求；contents: read 仅用于 checkout。
permissions:
  contents: read
  id-token: write

# 发布不可并发：两个 run 同时发同一版本会让后者失败，且顺序被打乱。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      - name: Test
        run: pnpm -r --if-present run test

      - name: Verify aggregate patch is up to date
        run: node scripts/aggregate.mjs --check

      - name: Show publish plan
        run: |
          node scripts/publish.mjs

      # 顺序敏感：子插件必须先上线，聚合包才能解析到它的依赖版本。
      # 逐包发布而非一次性，使某个包失败时能立刻定位，且不会发半个版本出去。
      - name: Publish packages in dependency order
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          node scripts/publish.mjs > /tmp/plan.txt
          while IFS="$(printf '\t')" read -r dir name version; do
            [ -n "$dir" ] || continue
            echo "::group::publishing $name@$version"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published -- skipping"
            else
              ( cd "$dir" && npm publish --access public )
            fi
            echo "::endgroup::"
          done < /tmp/plan.txt

      - name: Dry run notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: echo 'dry_run=true -- publish step skipped.'
