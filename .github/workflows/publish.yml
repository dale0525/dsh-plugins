# 发布：把本仓库的包发到 npm。
#
# 认证走 **trusted publishing (OIDC)** —— 不存任何长期 token。
# npm 正在移除 bypass-2FA token 的直接发布能力（官方 targeting 2027-01），
# 且 write token 需定期轮换；OIDC 每次发布换取短时、工作流专属、不可导出的凭证。
#
# 前置（一次性，人工）：每个包在 npmjs.com 配好 trusted publisher，
# 且 **必须勾选 allow publish**（2026-09-03 之后创建的配置默认只允许 stage publish）。
# 等价 CLI：npm trust github <pkg> --file publish.yml --repo dale0525/dsh-plugins --allow-publish
#
# 发布顺序由 scripts/publish.mjs 从依赖边拓扑推导（子插件 → 聚合包），不写死包名。
# 触发方式：
#   - push tag v*：自动发布（正式发版路径）；
#   - workflow_dispatch：手动，可只预览计划（dry_run）。
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只打印发布计划，不真正发布（默认开；显式设为 false 才真发布）'
        required: false
        type: boolean
        # 安全默认：手动触发先预览，要真发布须显式改 false
        default: true

# id-token: write 是 OIDC 的硬性要求；contents: read 仅用于 checkout。
permissions:
  contents: read
  id-token: write

# 发布不可并发：两个 run 同时发同一版本会让后者失败，且顺序被打乱。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 第三方 action 全部锁 commit SHA 而非可变大版本 tag：
      # 本 job 持有 id-token: write，tag 被劫持即可换取 npm 发布凭证。
      # SHA 由 GitHub API 解析 v4 tag 得到（annotated tag 已 peel 到 commit）。
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # 必须显式给 version：本仓库没有 packageManager 字段，而 action-setup
      # 在两者都缺时会直接失败（README: "otherwise, this field is required"）。
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # 发布必须可复现：锁定依赖树，禁止 CI 期间解析到新版本
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present run typecheck

      # 必须用根脚本（pnpm test），不能用 'pnpm -r run test'：
      # -r 只覆盖 workspace 子项目，会跳过根包自己的 scripts/*.test.mjs。
      - name: Test
        run: pnpm test

      - name: Verify aggregate patch is up to date
        run: node scripts/aggregate.mjs --check

      - name: Show publish plan
        run: |
          node scripts/publish.mjs

      # 顺序敏感：子插件必须先上线，聚合包才能解析到它的依赖版本。
      # 逐包发布而非一次性，使某个包失败时能立刻定位，且不会发半个版本出去。
      # 只允许两种发布来源：tag push，或 main 上的手动触发且显式 dry_run=false。
      # 否则任何分支的 workflow_dispatch 都能换取 OIDC 凭证直接发版。
      - name: Publish packages in dependency order
        if: ${{ github.event_name == 'push' || (github.ref == 'refs/heads/main' && !inputs.dry_run) }}
        run: |
          set -euo pipefail
          node scripts/publish.mjs > /tmp/plan.txt
          while IFS="$(printf '\t')" read -r dir name version; do
            [ -n "$dir" ] || continue
            echo "::group::publishing $name@$version"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published -- skipping"
            else
              ( cd "$dir" && npm publish --access public )
            fi
            echo "::endgroup::"
          done < /tmp/plan.txt

      # 用真值判定而非 == true：经 CLI/REST 触发时 inputs 是字符串 "true"，
      # 而 == 会两侧转数字（Number("true")=NaN），'true' == true 实为 false。
      - name: Dry run notice
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo 'dry_run=true -- publish step skipped.'
