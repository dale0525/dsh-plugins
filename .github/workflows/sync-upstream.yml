# 上游同步：把各 fork 子包的上游新版本合进本仓库。
#
# 只开 PR，**绝不直接推 main**：上游发版频繁，冲突需人工裁定。
#
# 每个目标（= 一个 fork 子包）一个 matrix job，各自校验自己的
# packages/<dir>/sync-policy.json 并只同步自己。fail-fast 关闭：
# 一个目标失败不拖垮其余目标。
#
# 两个触发方式：
#   - schedule：每天一次。上游发版频繁，但每天最多一个 PR，避免噪音；
#   - workflow_dispatch：手动触发。
#
# 冲突分类由 scripts/sync-upstream.mjs 输出：A 类真冲突（需人工裁定）/ B 类机械重删。
# 该分类只在「应用 policy 后仍有冲突标记」时打印，随后以退出码 2 失败（不产出 PR）。
name: sync-upstream

on:
  schedule:
    # 每天 03:17 UTC（避开整点，减少 GitHub Actions 排队）
    - cron: '17 3 * * *'
  # 没有 inputs：各目标有自己的上游与 tag 命名空间（imagegen 是 v1.6.0、
  # market 是 v1.48.0），一个全局 ref 输入对其中绝大多数必然是错的，只会误导。
  # 要同步指定 ref，本地跑 `node scripts/sync-upstream.mjs --target <id> --ref <ref>`。
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 一个目标失败不拖垮其余目标
      fail-fast: false
      matrix:
        include:
          # `pkg` 是 id → npm 包名的可读映射（test 那行里也内嵌了同一个字符串）。
          # 计划 §8 的 matrix 骨架里就有它，保留。
          - id: workbuddy
            pkg: '@logictan/dsh-workbuddy-connect'
            test: 'pnpm --filter @logictan/dsh-workbuddy-connect test'
          - id: easyrewrite
            pkg: '@logictan/dsh-easyrewrite'
            test: 'pnpm --filter @logictan/dsh-easyrewrite test'
          - id: imagegen
            pkg: '@logictan/dsh-imagegen'
            test: 'pnpm --filter @logictan/dsh-imagegen typecheck'
          # better-reasoning-effort 的上游是不带 scope 的同名包。我们的 fork 改了
          # package.json 的包名（加 @logictan/ scope），而 patch 行 id 仍是
          # `dsh-better-reasoning-effort` —— 上游若改了 src/index.ts 的
          # `export const name`，本行 id 必须跟着改，否则宿主启动即
          # `duplicate loader entry id` 硬崩。同步 PR 合并前须人工核对这一条。
          - id: better-reasoning-effort
            pkg: '@logictan/dsh-better-reasoning-effort'
            test: 'pnpm --filter @logictan/dsh-better-reasoning-effort test'
          # OpenViking 是 monorepo：两个 fork 各有自己的 policy，故各占一行。
          # 插件行跑包测试（它会先经 prepare 钩子跑生成器，再跑自己的测试）。
          - id: openviking
            pkg: '@logictan/dsh-openviking'
            test: 'pnpm --filter @logictan/dsh-openviking test'
          - id: openviking-shared
            # 无 pkg：该目录不是 npm 包（没有 package.json），只是生成器的源载体，
            # 所以 pnpm --filter 够不到它，测试要直接点名。
            test: 'node --test packages/dsh-openviking-shared/*.test.mjs'
    # 按目标区分并发组：不同目标互不阻塞，同一目标不会并发两次
    concurrency:
      group: sync-upstream-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      # 第三方 action 锁 commit SHA（与本仓库 publish.yml 同一策略）
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # 需要完整历史：subtree pull 要基于共同祖先做三方合并
          fetch-depth: 0

      # 显式给 version：本仓库没有 packageManager 字段，两者都缺时 action-setup 直接失败。
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # 校验走脚本自己的 discoverTargets（单一真源），不在 YAML 里重抄一份 schema。
      # 计划 §8 要求的是「校验该 target 的 policy（url/prefix/baseline 非空）」；
      # 这里改用脚本的校验，是因为脚本还会额外要求 baselineCommit 非空（它重算清单时要用），
      # 而 discoverTargets 是那份 schema 的唯一真源 —— 两处各写一份会漂移。
      # 顺带用它打印的 target 行做人工可读的记录。
      - name: Validate sync policy
        id: policy
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          node --input-type=module -e '
            import { discoverTargets } from "./scripts/sync-upstream.mjs";
            const id = process.env.TARGET_ID;
            let targets;
            try {
              targets = discoverTargets();
            } catch (err) {
              console.error("[policy] " + (err && err.message ? err.message : String(err)));
              process.exit(1);
            }
            const hits = targets.filter((t) => t.id === id);
            if (hits.length !== 1) {
              console.error("expected exactly one target.id = " + id + ", got " + hits.length +
                " (known: " + targets.map((t) => t.id).join(", ") + ")");
              process.exit(1);
            }
            const t = hits[0];
            const rel = t.policyPath.replace(process.cwd() + "/", "");
            console.log(rel + ": id=" + t.id + " url=" + t.url + " prefix=" + t.prefix + " baseline=" + t.baseline);
            const fs = await import("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "path=" + rel + "\n");
          '

      # 跑同步脚本自己的契约测试。脚本是本次改动的核心，它的不变量（policy 顺序、
      # owned 覆盖、基线推进）比任何一个包的测试更贴近这次变更；根 `pnpm test` 虽然
      # 也包含 `node --test scripts/*.test.mjs`，但那条只在 publish.yml 里跑，
      # 本 workflow 之前完全不覆盖脚本本身 —— 脚本回归会一路带进 PR。
      #
      # 必须在 `Apply upstream sync` **之前**跑：测试用合成上游树比对「本仓库当前
      # 跟踪的文件集」（computeLists 读的是索引），前提是索引干净。同步之后索引里已多出
      # 上游新增文件（imagegen 的 src/client/config-entry.tsx 就是这样被带进来的），
      # 它随即不再落入 deleted，该断言必然失败 —— 实测 CI run 35975689540 的 imagegen
      # job 正是死在这一条。测试只依赖 node 内置模块与脚本本身，不需要 node_modules。
      - name: Test sync script
        run: node --test scripts/sync-upstream.test.mjs

      - name: Apply upstream sync
        id: sync
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          node scripts/sync-upstream.mjs --target "$TARGET_ID"

      # sync 脚本把结果提交在一条**临时分支**上（为了工作区可回退），那条分支从未推送到 origin。
      # create-pull-request 会用 HEAD 反推 workingBase，然后执行
      # `git reset --hard origin/<workingBase>`；HEAD 停在临时分支上时这一步必然
      # `fatal: ambiguous argument 'origin/sync-upstream/...'` 并以 128 失败。
      # 实测：6 个 job 里有 4 个死在这里，而它们全都已经成功完成了同步 —— 只是 PR 没开出来。
      #
      # 把同步结果搬回 main 并保持**暂存**态，令 workingBase == base == main，
      # 交给 action 自己去建 PR 分支（它只推 PR 分支，从不推 base）。
      - name: Move sync result onto main
        run: |
          sync_branch=$(git rev-parse --abbrev-ref HEAD)
          git checkout main
          git merge --squash --no-commit "$sync_branch"
          git branch -D "$sync_branch"
          echo "staged=$(git diff --cached --name-only | wc -l | tr -d ' ') 个文件"

      # 刻意不冻结：subtree pull 会带入上游的依赖变更，冻结会直接失败。
      # （publish.yml 相反——发布必须可复现，那里用 --frozen-lockfile。）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # 脚本自身的契约已由上面的 `Test sync script` 覆盖（它在同步前跑，理由见那里）。
      - name: Test
        run: ${{ matrix.test }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # 固定分支名，不取当前 HEAD：此时 HEAD 已在 main 上（见上一步），
          # 拿 HEAD 会得到 "main" 并让 action 拒绝在 base 上开 PR。
          # 该分支由 action 自己创建/更新；它只推这个 head，从不推 base（main）。
          branch: chore/sync-upstream-${{ matrix.id }}
          base: main
          title: 'chore: sync upstream ${{ matrix.id }}'
          commit-message: 'chore: sync upstream ${{ matrix.id }}'
          delete-branch: true
          body: |
            自动上游同步（`scripts/sync-upstream.mjs --target ${{ matrix.id }}` + `${{ steps.policy.outputs.path }}`）。

            **顺序**：先 `git checkout --theirs`（冲突条目取上游）→ 再按 pull **之前**的 commit 恢复 `owned` → 再 `git rm`（重删 `deleted`）。
            顺序反了会让本仓库的改造被上游覆盖。

            第 2 步用 `git checkout <pull 前的 HEAD> -- <owned>` 而非 `--ours`：`--ours/--theirs` 只对未合并的索引条目生效，
            对 git 干净三方合并的文件是**空操作**，我方版本会被静默污染。owned 的逐字节保证只由这一步承担。

            合并前请人工确认：
            - [ ] `${{ steps.policy.outputs.path }}` 的 `owned` / `deleted` 清单是否仍与仓库实际状态一致（本轮新增/删除的文件可能未登记）
            - [ ] 上游在「我们保留的文件」里的 bug 修复是否已带入
            - [ ] 我们删掉的功能是否被上游静默复活（`deleted` 清单覆盖不到的新文件）
