# 上游同步：把各 fork 子包的上游新版本合进本仓库。
#
# 只开 PR，**绝不直接推 main**：上游发版频繁，冲突需人工裁定。
#
# 每个目标（= 一个 fork 子包）一个 matrix job，各自校验自己的
# packages/<dir>/sync-policy.json 并只同步自己。fail-fast 关闭：
# 一个目标失败不拖垮其余目标。
#
# 两个触发方式：
#   - schedule：每天一次。上游发版频繁，但每天最多一个 PR，避免噪音；
#   - workflow_dispatch：手动触发。
#
# 冲突分类由 scripts/sync-upstream.mjs 输出：A 类真冲突（需人工裁定）/ B 类机械重删。
# 该分类只在「应用 policy 后仍有冲突标记」时打印，随后以退出码 2 失败（不产出 PR）。
name: sync-upstream

on:
  schedule:
    # 每天 03:17 UTC（避开整点，减少 GitHub Actions 排队）
    - cron: '17 3 * * *'
  # 没有 inputs：5 个目标各有自己的上游与 tag 命名空间（imagegen 是 v1.6.0、
  # market 是 v1.48.0），一个全局 ref 输入对其中 4 个必然是错的，只会误导。
  # 要同步指定 ref，本地跑 `node scripts/sync-upstream.mjs --target <id> --ref <ref>`。
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 一个目标失败不拖垮其余目标
      fail-fast: false
      matrix:
        include:
          # `pkg` 是 id → npm 包名的可读映射（test 那行里也内嵌了同一个字符串）。
          # 计划 §8 的 matrix 骨架里就有它，保留。
          - id: config-manager
            pkg: '@logictan/dsh-config-manager'
            test: 'pnpm --filter @logictan/dsh-config-manager test'
          - id: workbuddy
            pkg: '@logictan/dsh-workbuddy-connect'
            test: 'pnpm --filter @logictan/dsh-workbuddy-connect test'
          - id: easyrewrite
            pkg: '@logictan/dsh-easyrewrite'
            test: 'pnpm --filter @logictan/dsh-easyrewrite test'
          - id: market
            pkg: '@logictan/dshmarket'
            test: 'pnpm --filter @logictan/dshmarket test'
          - id: imagegen
            pkg: '@logictan/dsh-imagegen'
            test: 'pnpm --filter @logictan/dsh-imagegen typecheck'
    # 按目标区分并发组：不同目标互不阻塞，同一目标不会并发两次
    concurrency:
      group: sync-upstream-${{ matrix.id }}
      cancel-in-progress: false
    steps:
      # 第三方 action 锁 commit SHA（与本仓库 publish.yml 同一策略）
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # 需要完整历史：subtree pull 要基于共同祖先做三方合并
          fetch-depth: 0

      # 显式给 version：本仓库没有 packageManager 字段，两者都缺时 action-setup 直接失败。
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.4.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # 校验走脚本自己的 discoverTargets（单一真源），不在 YAML 里重抄一份 schema。
      # 计划 §8 原先要求的是「校验该 target 的 policy（url/prefix/baseline 非空）」；
      # 这里改用脚本的校验，是因为脚本还会额外要求 baselineCommit 非空（它重算清单时要用），
      # 而 discoverTargets 是那份 schema 的唯一真源 —— 两处各写一份会漂移。
      # 顺带用它打印的 target 行做人工可读的记录。
      - name: Validate sync policy
        id: policy
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          node --input-type=module -e '
            import { discoverTargets } from "./scripts/sync-upstream.mjs";
            const id = process.env.TARGET_ID;
            let targets;
            try {
              targets = discoverTargets();
            } catch (err) {
              console.error("[policy] " + (err && err.message ? err.message : String(err)));
              process.exit(1);
            }
            const hits = targets.filter((t) => t.id === id);
            if (hits.length !== 1) {
              console.error("expected exactly one target.id = " + id + ", got " + hits.length +
                " (known: " + targets.map((t) => t.id).join(", ") + ")");
              process.exit(1);
            }
            const t = hits[0];
            const rel = t.policyPath.replace(process.cwd() + "/", "");
            console.log(rel + ": id=" + t.id + " url=" + t.url + " prefix=" + t.prefix + " baseline=" + t.baseline);
            const fs = await import("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "path=" + rel + "\n");
          '

      - name: Apply upstream sync
        id: sync
        env:
          TARGET_ID: ${{ matrix.id }}
        run: |
          node scripts/sync-upstream.mjs --target "$TARGET_ID"

      - name: Capture applied branch
        id: branch
        run: |
          echo "name=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

      # 刻意不冻结：subtree pull 会带入上游的依赖变更，冻结会直接失败。
      # （publish.yml 相反——发布必须可复现，那里用 --frozen-lockfile。）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      # 先跑同步脚本自己的契约测试，再跑包测试：脚本是本次改动的核心，它自己的
      # 不变量（policy 顺序、owned 覆盖、基线推进）比任何一个包的测试更贴近这次变更。
      # 根 `pnpm test` 包含 `node --test scripts/*.test.mjs`，但那个只在 publish.yml 里跑，
      # 同步 workflow 之前完全不覆盖脚本本身 —— 脚本回归会一路带进 PR。
      - name: Test sync script
        run: node --test scripts/sync-upstream.test.mjs

      - name: Test
        run: ${{ matrix.test }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # 只推 PR 分支；本 action 从不推 base（main）
          branch: ${{ steps.branch.outputs.name }}
          base: main
          title: 'chore: sync upstream ${{ matrix.id }}'
          commit-message: 'chore: sync upstream ${{ matrix.id }}'
          delete-branch: true
          body: |
            自动上游同步（`scripts/sync-upstream.mjs --target ${{ matrix.id }}` + `${{ steps.policy.outputs.path }}`）。

            **顺序**：先 `git checkout --theirs`（冲突条目取上游）→ 再按 pull **之前**的 commit 恢复 `owned` → 再 `git rm`（重删 `deleted`）。
            顺序反了会让本仓库的改造被上游覆盖。

            第 2 步用 `git checkout <pull 前的 HEAD> -- <owned>` 而非 `--ours`：`--ours/--theirs` 只对未合并的索引条目生效，
            对 git 干净三方合并的文件是**空操作**，我方版本会被静默污染。owned 的逐字节保证只由这一步承担。

            合并前请人工确认：
            - [ ] `${{ steps.policy.outputs.path }}` 的 `owned` / `deleted` 清单是否仍与仓库实际状态一致（本轮新增/删除的文件可能未登记）
            - [ ] 上游在「我们保留的文件」里的 bug 修复是否已带入
            - [ ] 我们删掉的功能是否被上游静默复活（`deleted` 清单覆盖不到的新文件）
