overrides:
  # 把参与 Context 声明合并的宿主包收敛到宿主当前世代（升级前是 0.1.6-alpha.2）。
  # 目的不变：让声明合并落在同一个物理实例上，与真实 profile 一致。
  # 世代不跟着宿主走，dsh-openviking 的 overrides 会按旧世代钉出
  # dsh-llm@0.1.0-rc.6，它把 dsh-attachment 拖成第二份 0.1.0-rc.8 实例，
  # 产生两份互不兼容的 AttachmentStore 类型（宿主半边 typecheck 报 protected 成员不可赋值）。
  '@deepseek-ai/dsh-attachment': 0.2.1-rc.2
