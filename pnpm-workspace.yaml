packages:
  - 'packages/*'

# 根包（private）只是工作区壳；聚合包 @logictan/dsh-plugins-all 的 dependencies
# 写普通 semver range，仓库内开发时链接到 workspace 工程（版本同源），
# profile 里从 npm registry 安装时按该 range 解析。
#
# 这两个包只出现在 devDependencies 的传递依赖里
# （better-reasoning-effort → @deepseek-ai/dsh-llm-pi-ai → @earendil-works/pi-ai），
# 它们的 install 脚本对构建/测试/运行都不是必需的，显式拒绝执行以免 CI 静默跑第三方脚本。
#
# esbuild 同属「脚本非必需」：fork 自 dsh-better-reasoning-effort 的子包用它做
# host/client 打包，但 0.16 起平台二进制由 optionalDependencies 里的
# `@esbuild/<platform>` 提供，`install.js` 只做校验。实测未跑该脚本时
# `esbuild.version` 与 `transformSync` 均正常，故显式拒绝。
# 必须写出来：不写就是「未决」——pnpm 会以 ERR_PNPM_IGNORED_BUILDS 让
# `pnpm install --frozen-lockfile`（publish.yml 的第 1 步）直接失败。
allowBuilds:
  '@google/genai': false
  protobufjs: false
  esbuild: false
  # ssh2 的 install 脚本只是试着用 node-gyp 编一个**可选**的 crypto 绑定，失败即退出 0；
  # cpu-features 是它的可选原生依赖，缺失时 lib/protocol/constants.js 走 catch 分支。
  # 两者都不跑，ssh2 仍是纯 JS 实现（实测 exec + SFTP 收发正常）——这正是本插件要的：
  # 跨平台不依赖编译工具链。
  # 这里只解决**本仓库开发时**的安装：dsh-ssh 把 ssh2 打成 bundle 后，它只是 devDependency，
  # 用户 profile 里不装它、也就没有这条脚本要审批（理由见 packages/dsh-ssh/build.mjs 抬头）。
  cpu-features: false
  ssh2: false

linkWorkspacePackages: true

# 一个真实 profile 里每个 @deepseek-ai 包只存在一份物理实例，插件通过宿主提供的
# 服务（如 `ctx.get('attachments')`）拿到的就是那一份。工作区里各子插件自带的旧
# 世代副本会被 pnpm 各留一份，声明合并（Context / SlotMap）因此落进不同模块，类型
# 互不兼容。这里把参与声明合并的宿主包收敛到宿主当前世代，与运行时形态一致。
minimumReleaseAgeExclude:
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/schemastery@3.18.5'
  - '@deepseek-ai/cordis-plugin-group@1.0.3'
