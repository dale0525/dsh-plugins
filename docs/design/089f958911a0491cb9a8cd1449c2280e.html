<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness · 侧边栏卡片规范 (macOS 暗色 340×700)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0F1626;
      color: #E2E8F0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }
    .font-mono-code {
      font-family: "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    /* 针对暗色微细 1px 边框的平滑渲染 */
    .card-border {
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .selected-border {
      border: 1px solid rgba(96, 165, 250, 0.28);
    }
  </style>
</head>
<body class="w-[340px] h-[700px] bg-[#0F1626] p-3 box-border flex flex-col justify-start select-none">

  <!-- 侧边栏卡片容器列表，卡片之间间距 8px -->
  <div class="flex flex-col gap-[8px] w-full">

    <!-- 卡片一：小说 (含 6 行会话) -->
    <div class="w-full bg-[rgba(255,255,255,0.04)] card-border rounded-[14px] p-[8px] box-border flex flex-col">
      <!-- 标题行：34px 高度 -->
      <div class="h-[34px] px-[8px] rounded-[12px] flex items-center shrink-0">
        <!-- 文件夹细线图标 16px #94A3B8 -->
        <svg class="w-4 h-4 text-[#94A3B8] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="ml-2 text-[13px] font-[500] text-[#E2E8F0] tracking-tight">小说</span>
        <!-- 数字标：高 17px，间距 6px -->
        <span class="ml-[6px] h-[17px] min-w-[17px] px-[5px] inline-flex items-center justify-center rounded-full bg-[rgba(255,255,255,0.1)] text-[10px] font-mono-code font-medium text-[#CBD5E1] leading-none">5</span>
      </div>

      <!-- 会话列表 -->
      <div class="flex flex-col gap-[2px] mt-[2px]">
        
        <!-- 会话 1：双行 (46px) -->
        <div class="h-[46px] px-[8px] rounded-[12px] flex flex-col justify-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <div class="flex items-center w-full">
            <!-- 容器图标 14px 细线 #93C5FD -->
            <svg class="w-[14px] h-[14px] text-[#93C5FD] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="3" x2="6" y2="15"></line>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <path d="M18 9a9 9 0 0 1-9 9"></path>
            </svg>
            <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-snug">整理事件并检阅优化剧情</span>
            <span class="text-[10px] text-[#64748B] shrink-0 ml-2">1天</span>
          </div>
          <!-- 第二行：精确左缩进 18px (图标 14px + 间距 4px)，与标题文本左边缘严格对齐 -->
          <div class="pl-[18px] text-[10.5px] font-[500] text-[#93C5FD] font-mono-code leading-[14px] tracking-[0.2px] truncate">
            fusheng-ke-tongxing
          </div>
        </div>

        <!-- 会话 2：双行 (46px) - 处于选中态 -->
        <div class="h-[46px] px-[8px] rounded-[12px] bg-[#121927] selected-border flex flex-col justify-center cursor-default">
          <div class="flex items-center w-full">
            <svg class="w-[14px] h-[14px] text-[#93C5FD] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="3" x2="6" y2="15"></line>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <path d="M18 9a9 9 0 0 1-9 9"></path>
            </svg>
            <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-snug">写第一单元事件 5</span>
            <span class="text-[10px] text-[#64748B] shrink-0 ml-2">1天</span>
          </div>
          <div class="pl-[18px] text-[10.5px] font-[500] text-[#93C5FD] font-mono-code leading-[14px] tracking-[0.2px] truncate">
            xingmian
          </div>
        </div>

        <!-- 会话 3：双行 (46px) -->
        <div class="h-[46px] px-[8px] rounded-[12px] flex flex-col justify-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <div class="flex items-center w-full">
            <svg class="w-[14px] h-[14px] text-[#93C5FD] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="3" x2="6" y2="15"></line>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <path d="M18 9a9 9 0 0 1-9 9"></path>
            </svg>
            <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-snug">第一卷第一单元事件 2</span>
            <span class="text-[10px] text-[#64748B] shrink-0 ml-2">5天</span>
          </div>
          <div class="pl-[18px] text-[10.5px] font-[500] text-[#93C5FD] font-mono-code leading-[14px] tracking-[0.2px] truncate">
            ten-year-first-move
          </div>
        </div>

        <!-- 会话 4：双行 (46px) -->
        <div class="h-[46px] px-[8px] rounded-[12px] flex flex-col justify-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <div class="flex items-center w-full">
            <svg class="w-[14px] h-[14px] text-[#93C5FD] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="3" x2="6" y2="15"></line>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <path d="M18 9a9 9 0 0 1-9 9"></path>
            </svg>
            <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-snug">检阅两界一间铺设定冲突</span>
            <span class="text-[10px] text-[#64748B] shrink-0 ml-2">5天</span>
          </div>
          <div class="pl-[18px] text-[10.5px] font-[500] text-[#93C5FD] font-mono-code leading-[14px] tracking-[0.2px] truncate">
            liangjie-yijianpu
          </div>
        </div>

        <!-- 会话 5：双行 (46px) -->
        <div class="h-[46px] px-[8px] rounded-[12px] flex flex-col justify-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <div class="flex items-center w-full">
            <svg class="w-[14px] h-[14px] text-[#93C5FD] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="6" y1="3" x2="6" y2="15"></line>
              <circle cx="18" cy="6" r="3"></circle>
              <circle cx="6" cy="18" r="3"></circle>
              <path d="M18 9a9 9 0 0 1-9 9"></path>
            </svg>
            <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-snug">天道小饭馆设定冲突检查</span>
            <span class="text-[10px] text-[#64748B] shrink-0 ml-2">5天</span>
          </div>
          <div class="pl-[18px] text-[10.5px] font-[500] text-[#93C5FD] font-mono-code leading-[14px] tracking-[0.2px] truncate">
            tian-dao-xiao-fan-guan
          </div>
        </div>

        <!-- 会话 6：单行 (32px)，无第二行小字，文档图标 #64748B -->
        <div class="h-[32px] px-[8px] rounded-[12px] flex items-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <svg class="w-[14px] h-[14px] text-[#64748B] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-none">整理主线时间线</span>
          <span class="text-[10px] text-[#64748B] shrink-0 ml-2">9天</span>
        </div>

      </div>
    </div>

    <!-- 卡片二：果糖私人医生 (无数字标，无会话行) -->
    <div class="w-full bg-[rgba(255,255,255,0.04)] card-border rounded-[14px] p-[8px] box-border">
      <div class="h-[34px] px-[8px] rounded-[12px] flex items-center">
        <svg class="w-4 h-4 text-[#94A3B8] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="ml-2 text-[13px] font-[500] text-[#E2E8F0] tracking-tight">果糖私人医生</span>
      </div>
    </div>

    <!-- 卡片三：dsh-plugins (3 行单行会话) -->
    <div class="w-full bg-[rgba(255,255,255,0.04)] card-border rounded-[14px] p-[8px] box-border flex flex-col">
      <div class="h-[34px] px-[8px] rounded-[12px] flex items-center shrink-0">
        <svg class="w-4 h-4 text-[#94A3B8] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="ml-2 text-[13px] font-[500] text-[#E2E8F0] tracking-tight font-mono-code">dsh-plugins</span>
      </div>

      <!-- 会话列表：3行单行文档图标 -->
      <div class="flex flex-col gap-[2px] mt-[2px]">
        
        <!-- 会话 1 -->
        <div class="h-[32px] px-[8px] rounded-[12px] flex items-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <svg class="w-[14px] h-[14px] text-[#64748B] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-none">局域网访问 dsh 的优化</span>
          <span class="text-[10px] text-[#64748B] shrink-0 ml-2">14分钟</span>
        </div>

        <!-- 会话 2 -->
        <div class="h-[32px] px-[8px] rounded-[12px] flex items-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <svg class="w-[14px] h-[14px] text-[#64748B] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-none">侧边栏显示 worktree 归属</span>
          <span class="text-[10px] text-[#64748B] shrink-0 ml-2">21分钟</span>
        </div>

        <!-- 会话 3 -->
        <div class="h-[32px] px-[8px] rounded-[12px] flex items-center cursor-default transition-colors hover:bg-[rgba(255,255,255,0.02)]">
          <svg class="w-[14px] h-[14px] text-[#64748B] shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
          </svg>
          <span class="ml-[4px] text-[13px] font-[400] text-[#E2E8F0] truncate flex-1 leading-none">优化 worktree-session 的图标</span>
          <span class="text-[10px] text-[#64748B] shrink-0 ml-2">36分钟</span>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
